<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野菜カレンダー（テスト）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== パスワード画面 ===== */
    #lock-screen {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }

    #lock-screen .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    #lock-screen h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    #lock-screen p {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    #lock-screen input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }

    #lock-screen input:focus {
      border-color: #6aaa64;
    }

    #lock-screen button {
      width: 100%;
      padding: 12px;
      background: #6aaa64;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #lock-screen button:hover {
      background: #5a9454;
    }

    #error-msg {
      color: #e05555;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* ===== コンテンツ画面 ===== */
    #content {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    #content h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 16px;
    }

    #content p {
      font-size: 16px;
      color: #666;
      margin-bottom: 24px;
    }

    #content .badge {
      display: inline-block;
      background: #6aaa64;
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- パスワード画面 -->
  <div id="lock-screen">
    <div class="icon">🥦</div>
    <h1>野菜カレンダー</h1>
    <p>パスワードを入力してください</p>
    <input type="password" id="pw-input" placeholder="パスワード" />
    <button onclick="checkPassword()">入る</button>
    <div id="error-msg">パスワードが違います</div>
  </div>

  <!-- ロック解除後のコンテンツ -->
  <div id="content">
    <div style="font-size:64px; margin-bottom:16px;">🌱</div>
    <h1>パスワード解除できました！</h1>
    <p>ここに野菜カレンダーの内容を入れます。<br>テスト成功です🎉</p>
    <div class="badge">✅ 認証済み</div>
  </div>

  <script>
    // ★ここがパスワード★
    const CORRECT_PASSWORD = "mogimogi";

    function checkPassword() {
      const input = document.getElementById('pw-input').value;
      if (input === CORRECT_PASSWORD) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } else {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
      }
    }

    // Enterキーでも入れるように
    document.getElementById('pw-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>

</body>
</html>
